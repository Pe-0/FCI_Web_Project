<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spec Zone - Login</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body class="login-page">
  <main>
    <div class="form-box">
      <h1>Login</h1>
      <form id="login-form">
        <label>Email</label>
        <input type="text" placeholder="you@email.com" required>

        <label>Password</label>
        <input type="password" placeholder="Password" required>

        <button type="submit">Login</button>
      </form>
    </div>
  </main>

</body>
</html>
